spring.application.name=validacao-documentos
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ocr.command=${APP_OCR_COMMAND:C:/Program Files/Tesseract-OCR/tesseract.exe}
app.ocr.tessdata-path=${APP_OCR_TESSDATA_PATH:}
app.ocr.page-segmentation-mode=${APP_OCR_PSM:11}
spring.datasource.url=jdbc:h2:file:./data/validacao-documentos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
